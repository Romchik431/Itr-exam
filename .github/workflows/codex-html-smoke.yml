name: HTML smoke test

on:
  push:
    branches:
      - codex/github-setup-check

permissions:
  contents: read

jobs:
  check-html:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML test page
        run: |
          grep -Fx '<!doctype html>' index.html
          grep -F '<h1>Проверка записи в GitHub</h1>' index.html
